version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: expense-tracker-db
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: expense_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_user -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./expense-tracker-api
    container_name: expense-tracker-api
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PORT: 8081
      DATABASE_URL: jdbc:postgresql://postgres:5432/expense_tracker
      DATABASE_USERNAME: expense_user
      DATABASE_PASSWORD: expense_pass
      JWT_SECRET: local-dev-secret-key-change-in-production-min-32-chars
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./expense-tracker-ui
    container_name: expense-tracker-ui
    ports:
      - "3000:80"
    environment:
      BACKEND_URL: http://backend:8081
      PORT: 80
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
